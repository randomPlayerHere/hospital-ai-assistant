name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend lint + types
        working-directory: backend
        run: |
          pip install -e '.[dev]'
          ruff check .
          black --check .
          mypy app
      - name: Frontend lint + types + format
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npx prettier --check .

  backend-tests:
    runs-on: ubuntu-latest
    needs: lint-and-types
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hospital_migrator, POSTGRES_PASSWORD: change-me, POSTGRES_DB: postgres }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U hospital_migrator" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Test with coverage gate
        working-directory: backend
        run: |
          pip install -e '.[dev]'
          python -m pytest --cov=app --cov-fail-under=80 --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    needs: lint-and-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  build-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with: { context: backend, tags: "hospital-ai-backend:ci", load: true, cache-from: "type=gha,scope=backend", cache-to: "type=gha,scope=backend,mode=max" }
      - name: Build frontend
        uses: docker/build-push-action@v6
        with: { context: frontend, tags: "hospital-ai-frontend:ci", load: true, build-args: "NEXT_PUBLIC_API_URL=http://localhost:8000", cache-from: "type=gha,scope=frontend", cache-to: "type=gha,scope=frontend,mode=max" }
      - name: Save images for later jobs
        run: docker save hospital-ai-backend:ci hospital-ai-frontend:ci | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: images, path: images.tar.gz, retention-days: 1 }

  e2e:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: images }
      - name: Start stack
        run: |
          docker load < images.tar.gz
          docker tag hospital-ai-backend:ci hospital-ai-backend:latest
          docker tag hospital-ai-backend:ci hospital-ai-worker:latest
          docker tag hospital-ai-frontend:ci hospital-ai-frontend:latest
          cp .env.example .env
          KEY=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          sed -i "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$KEY|; s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml --env-file .env up -d --no-build --wait
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml --env-file .env exec -T backend python -m app.seed
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs --tail=200
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  security-scan:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pip-audit + bandit
        working-directory: backend
        run: |
          pip install -e '.[dev]'
          pip-audit
          bandit -q -r app -x app/ai/evals
      - name: npm audit
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
      - uses: actions/download-artifact@v4
        with: { name: images }
      - name: Trivy image scan (fail on fixed HIGH/CRITICAL)
        run: |
          docker load < images.tar.gz
          for img in hospital-ai-backend:ci hospital-ai-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$img"
          done
